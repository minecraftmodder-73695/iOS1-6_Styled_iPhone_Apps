<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Store – iOS 6</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; height: 100dvh; background: #1c1c1e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }

  /* Everything is laid out in the SVG's native 320×568 space, then scaled to fit. */
  #fit { position: relative; width: 320px; height: 568px; flex: none; }
  #device { position: absolute; left: 0; top: 0; width: 320px; height: 568px; transform-origin: 0 0; background: #000; overflow: hidden;
            box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6); }

  /* ---------- scrolling list (sits under the SVG chrome) ---------- */
  #list { position: absolute; inset: 20px 0 0 0; overflow-y: auto; overflow-x: hidden;
          padding-top: 88px; padding-bottom: 49px; scrollbar-width: none;
          -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
          background-color: #EBEBEB;
          background-image: linear-gradient(#fff 0 1px, #F5F5F5 1px, #F5F5F5 89px, rgba(0,0,0,.1) 89px, rgba(0,0,0,.1) 90px,
                                            #fff 90px, #fff 91px, #EBEBEB 91px, #EBEBEB 179px, rgba(0,0,0,.1) 179px);
          background-size: 100% 180px; background-position: 0 88px; background-attachment: local; }
  #list::-webkit-scrollbar, #catList::-webkit-scrollbar { display: none; }

  a.row { position: relative; display: block; height: 90px; color: inherit; text-decoration: none; outline: none; }
  a.row:nth-child(odd)  { background-color: #F5F5F5; }
  a.row:nth-child(even) { background-color: #EBEBEB; }
  a.row { box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.1); }

  .num { position: absolute; left: 0; width: 38.5px; top: 36px; text-align: center;
         font-weight: bold; font-size: 17px; line-height: 20px; color: #ACACAC; text-shadow: 0 1px 0 #fff; }
  .icon { position: absolute; left: 40px; top: 13px; width: 64px; height: 64px; border-radius: 11px;
          box-shadow: 0 1px .5px rgba(0,0,0,.75); background: #888; overflow: hidden; }
  .icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .icon .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
              font-size: 30px; font-weight: bold; color: rgba(255,255,255,.9);
              text-shadow: 0 1px 1px rgba(0,0,0,.4); background: linear-gradient(#8aa4c8, #3d5f94); }
  .icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25); }

  .meta { position: absolute; left: 114.5px; top: 0; bottom: 0; right: 76px; }
  .title { position: absolute; left: 0; right: 0; top: 23.5px; line-height: 18px; white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; font-weight: bold; font-size: 14px; color: #4D4D4D; text-shadow: 0 1px 0 #fff; }
  .cat { position: absolute; left: 0; top: 41.5px; line-height: 14px; font-size: 11.5px; color: #747474;
         text-shadow: 0 1px 0 #fff; white-space: nowrap; }
  .rate { position: absolute; left: -.5px; top: 57.5px; height: 9px; display: flex; align-items: center; }
  .rate svg { width: 8px; height: 8.5px; margin-right: 1px; overflow: visible; flex: none; }
  .rate .cnt { margin-left: 3px; font-size: 10px; line-height: 10px; color: #ACACAC; text-shadow: 0 1px 0 #fff; position: relative; top: 1px; }

  .btn { position: absolute; right: 8px; top: 32.5px; height: 25px; min-width: 55px; padding: 1px 10px 0;
         border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11.5px; line-height: 1;
         color: #6A6A6A; text-shadow: 0 1px 0 #fff; text-transform: uppercase; white-space: nowrap;
         background: linear-gradient(#EFEFEF, #DBDBDB);
         box-shadow: inset 0 0 0 1px #d4d4d4, 0 0 0 .5px rgba(0,0,0,.35), 0 1px 0 #fff, inset 0 1px 0 rgba(255,255,255,.9); }
  .btn::after { content:""; position:absolute; inset:0; border-radius:3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }

  /* selected row = iOS 6 blue highlight */
  a.row:active, a.row:focus-visible, .crow:active { background: linear-gradient(#34a2f4, #0a6fe0) !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.25); }
  a.row:active .num, a.row:focus-visible .num { color: #cfe6fb; text-shadow: 0 -1px 0 rgba(0,0,0,.3); }
  a.row:active .title, a.row:active .cat, a.row:active .cnt,
  a.row:focus-visible .title, a.row:focus-visible .cat, a.row:focus-visible .cnt,
  .crow:active .cl { color: #fff !important; text-shadow: 0 -1px 0 rgba(0,0,0,.35) !important; }
  .crow:active .chk { display: none; }

  /* ---------- SVG chrome on top (status bar, nav bar, tab bar) ---------- */
  #chrome { position: absolute; inset: 0; width: 320px; height: 568px; pointer-events: none; z-index: 2; }

  #clock { position: absolute; z-index: 3; left: 0; width: 320px; top: 0; height: 20px; text-align: center; pointer-events: none;
           font-weight: bold; font-size: 13.5px; line-height: 21px; color: rgba(255,255,255,.75);
           text-shadow: 0 -1px 0 rgba(0,0,0,.5); }


  #title { position: absolute; z-index: 3; left: 90px; width: 140px; top: 29px; height: 24px; text-align: center; pointer-events: none;
           font-weight: bold; font-size: 20px; line-height: 24px; color: #C8C8C8; text-shadow: 0 -1px 0 rgba(0,0,0,.8);
           white-space: nowrap; overflow: hidden; }

  /* ---------- bottom tab bar: iOS / Android ---------- */
  #tabbar { position: absolute; z-index: 3; left: 0; top: 519px; width: 320px; height: 49px; display: flex;
            box-shadow: 0 -2px 1px rgba(0,0,0,.1); }
  #tabbar button { position: relative; flex: 1; height: 49px; background: linear-gradient(#454545, #393939 33%, #272726 67%, #19191A);
            box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 0 1.5px 0 rgba(255,255,255,.15), inset 0 1px 0 rgba(0,0,0,.9); }
  #tabbar button + button { box-shadow: inset 0 2px 0 rgba(255,255,255,.1), inset 0 1.5px 0 rgba(255,255,255,.15), inset 0 1px 0 rgba(0,0,0,.9), inset 1px 0 0 rgba(0,0,0,.6); }
  #tabbar button.on { background: linear-gradient(#2A2A2A, #353535 33%, #3E3E3E 67%, #444);
            box-shadow: inset 0 2px 4px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.1), inset 0 1.5px 0 rgba(255,255,255,.1), inset 0 1px 0 rgba(0,0,0,.6); }
  #tabbar button.on + button, #tabbar button + button.on { box-shadow: inset 0 2px 4px rgba(0,0,0,.4), inset 1px 0 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(0,0,0,.6); }
  #tabbar svg { position: absolute; left: 50%; top: 4px; width: 32px; height: 30px; margin-left: -16px; overflow: visible;
                filter: drop-shadow(0 1px 0 rgba(255,255,255,.25)); }
  #tabbar svg .ga { fill: url(#gOffA); }
  #tabbar button.on svg .ga { fill: url(#gOnA); }
  #tabbar svg .gb { fill: url(#gOffB); }
  #tabbar button.on svg .gb { fill: url(#gOnB); }
  #tabbar button[data-platform="ios"] svg { top: 7px; width: 19px; height: 23px; margin-left: -9.5px; }
  #tabbar button[data-platform="android"] svg { top: 5px; width: 24px; height: 28px; margin-left: -12px; }
  #tabbar .tl { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-weight: bold; font-size: 10px; line-height: 12px;
                color: #a8a8a8; text-shadow: 0 -1px 0 rgba(0,0,0,.8); }
  #tabbar button.on .tl { color: #fff; }

  /* tappable Categories button over the SVG one */
  #catBtn { position: absolute; z-index: 3; left: 5px; top: 27px; width: 83px; height: 29px; border-radius: 5px; }
  #catBtn:active { background: rgba(0,0,0,.35); }

  /* ---------- segmented control (Top Paid / Top Free) ---------- */
  #seg { position: absolute; z-index: 3; left: 5px; top: 71px; width: 310px; height: 29px; display: flex;
         border-radius: 5px; overflow: hidden;
         box-shadow: 0 .5px .25px rgba(255,255,255,.2), 0 0 1px #000, inset 0 1px .25px rgba(0,0,0,.6);
         background: #000; }
  #seg button { position: relative; flex: 1; height: 29px; font-weight: bold; font-size: 12.5px; line-height: 31px;
                color: #C8C8C8; text-shadow: 0 -1px 0 rgba(0,0,0,.8);
                background: linear-gradient(rgba(255,255,255,.05), rgba(60,60,60,.85) 0, rgba(0,0,0,.2) 80%); background-color: #4a4a4a;
                background-image: linear-gradient(rgba(255,255,255,.05), rgba(0,0,0,.2) 80%); }
  #seg button + button { box-shadow: inset 1px 0 0 rgba(0,0,0,.4); }
  #seg button.on { color: #fff; background-image: linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.6) 80%);
                   box-shadow: inset 0 1px 3px rgba(0,0,0,.9), inset 0 0 1px #000; }
  #seg button.on + button { box-shadow: inset 1px 0 0 rgba(0,0,0,.4); }
  #seg::after { content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none; box-shadow: inset 0 0 1px #000; }

  /* ---------- Categories sheet ---------- */
  #sheet { position: absolute; z-index: 10; left: 0; top: 20px; width: 320px; height: 548px; background: #EBEBEB;
           transform: translateY(102%); visibility: hidden;
           transition: transform .325s linear, visibility 0s .325s; }
  #sheet.open { transform: none; visibility: visible; transition: transform .325s linear, visibility 0s; }
  #sheetNav { position: absolute; left: 0; top: 0; width: 320px; height: 44px; z-index: 3; pointer-events: none; }
  #sheetNav svg { display: block; overflow: visible; }
  #cancel { position: absolute; z-index: 4; left: 255px; top: 7px; width: 60px; height: 29px; border-radius: 5px; }
  #cancel:active { background: rgba(0,0,0,.35); }
  #catList { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow-y: auto; scrollbar-width: none;
             overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background-color: #EBEBEB;
             background-image: linear-gradient(#fff 0 1px, #EBEBEB 1px, #EBEBEB 43px, rgba(0,0,0,.1) 43px);
             background-size: 100% 44px; background-attachment: local; }
  .crow { position: relative; display: block; width: 100%; height: 44px; text-align: left; background: #EBEBEB;
          box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.1); }
  .ci { position: absolute; left: 10px; top: 7px; width: 30px; height: 30px; border-radius: 5px; overflow: hidden;
        box-shadow: 0 1px .5px rgba(0,0,0,.75); background: #888; }
  .ci img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ci .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 15px;
            font-weight: bold; color: rgba(255,255,255,.9); background: linear-gradient(#8aa4c8, #3d5f94); }
  .ci::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .cl { position: absolute; left: 50px; right: 40px; top: 1.5px; line-height: 44px; font-weight: bold; font-size: 17px;
        color: #4D4D4D; text-shadow: 0 1px 0 #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow.sel .cl { color: #384C84; }
  .chk { position: absolute; left: 297.5px; top: 15px; width: 12.5px; height: 13.5px; display: none; filter: drop-shadow(0 1px 0 #fff); }
  .crow.sel .chk { display: block; }
</style>

      <button id="cancel" aria-label="Cancel"></button>

<script>
/* ------------------------------------------------------------------
   Data: apps.txt is fetched and parsed at load. Format:

   app1 {
       name: "Medley Music Player";
       category: "Music"
       icon: "medley.webp";
       link: "https://apps.apple.com/...";
       platform: "ios"       (or "android"; missing = ios)
       price: "$0.99";        (optional)  paid apps show under Top Paid; missing/free/$0 = Top Free
       rating: 4.5;           (optional)  0–5, draws the star row
       ratings: 8966;         (optional)  review count shown in parentheses
   }
------------------------------------------------------------------- */
const APPS_URL = 'assets/apps.txt';

function parseApps(txt) {
  const apps = [];
  const block = /([\w-]+)\s*\{([^}]*)\}/g;
  const pair  = /(\w+)\s*:\s*(?:"([^"]*)"|'([^']*)'|([^;\n]+))/g;
  let b;
  while ((b = block.exec(txt))) {
    const app = { id: b[1] };
    let p; pair.lastIndex = 0;
    while ((p = pair.exec(b[2]))) app[p[1]] = (p[2] ?? p[3] ?? p[4]).trim();
    apps.push(app);
  }
  return apps;
}

async function loadApps() {
  try {
    const r = await fetch(APPS_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return parseApps(await r.text());
  } catch (e) {
    console.error('Could not fetch ' + APPS_URL + ' (' + e + '). Serve this folder over http.');
    return [];
  }
}

/* ---------- state ---------- */
let APPS = [];
const state = { platform: 'ios', tab: 'free', cat: null };       // cat === null → All Categories
const platformOf = a => /android/i.test(a.platform || '') ? 'android' : 'ios';     // missing platform = ios
const platformApps = () => APPS.filter(a => platformOf(a) === state.platform);
const isFree = a => !a.price || /^(free|get|install|view|\$?0([.,]0+)?)$/i.test(a.price.trim());

/* ---------- helpers ---------- */
const STAR = 'M3 3L4 0L5 3H8L5.5 5L6.5 8.5L4 6.5L1.5 8.5L2.5 5L0 3H3Z';
let gid = 0;
function stars(rating) {
  let out = '';
  for (let i = 0; i < 5; i++) {
    const f = Math.max(0, Math.min(1, rating - i));
    const g = 'sg' + (gid++);
    out += `<svg viewBox="0 0 8 8.5" aria-hidden="true">
      <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFDE00"/><stop offset="1" stop-color="#FF6C00"/></linearGradient>
      <clipPath id="${g}c"><rect x="0" y="0" width="${(f >= .75 ? 8 : f >= .25 ? 4 : 0)}" height="9"/></clipPath></defs>
      <path d="${STAR}" fill="#fff" fill-opacity=".55"/>
      <path d="${STAR}" fill="url(#${g})" clip-path="url(#${g}c)"/>
      <path d="${STAR}" fill="none" stroke="#000" stroke-opacity=".3" stroke-width=".4"/></svg>`;
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICON_DIR = 'assets/';     // icons are looked up here first, then next to index.html
function setIcon(holder, app) {
  const hide = () => { holder.innerHTML = ''; holder.style.display = 'none'; };   // no placeholder tile
  if (!app.icon) return hide();
  const name = app.icon.replace(/^\.?\//, '');
  const tries = /^(https?:|data:|assets\/)/i.test(name) ? [name] : [ICON_DIR + name, name];
  const img = new Image(); img.alt = ''; img.decoding = 'async';
  let i = 0;
  img.onerror = () => { if (++i < tries.length) img.src = tries[i]; else hide(); };
  img.src = tries[0];
  holder.appendChild(img);
}

/* ---------- Top Charts list ---------- */
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('tabPaid').classList.toggle('on', state.tab === 'paid');
  document.getElementById('tabFree').classList.toggle('on', state.tab === 'free');
  document.getElementById('tabPaid').setAttribute('aria-selected', state.tab === 'paid');
  document.getElementById('tabFree').setAttribute('aria-selected', state.tab === 'free');
  list.setAttribute('aria-label', state.tab === 'paid' ? 'Top Paid' : 'Top Free');

  document.getElementById('title').textContent = state.platform === 'ios' ? 'Top iOS' : 'Top Android';
  document.querySelectorAll('#tabbar button').forEach(b => { const on = b.dataset.platform === state.platform; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  const shown = platformApps().filter(a => (state.tab === 'paid') === !isFree(a))
                    .filter(a => state.cat === null || a.category === state.cat);
  shown.forEach((app, i) => {
    const a = document.createElement('a');
    a.className = 'row'; a.setAttribute('role', 'listitem');
    a.href = app.link || '#'; a.target = '_blank'; a.rel = 'noopener';
    const rating = parseFloat(app.rating);
    const ratings = app.ratings ? Number(String(app.ratings).replace(/,/g, '')) : NaN;
    a.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="icon"></div>
      <div class="meta">
        <div class="title">${esc(app.name || '')}</div>
        <div class="cat">${esc(app.category || '')}</div>
        ${isNaN(rating) ? '' : `<div class="rate">${stars(rating)}${isNaN(ratings) ? '' : `<span class="cnt">(${ratings.toLocaleString('en-US')})</span>`}</div>`}
      </div>
      <div class="btn">${esc(isFree(app) ? 'Free' : app.price)}</div>`;
    setIcon(a.querySelector('.icon'), app);
    list.appendChild(a);
    a.querySelector('.meta').style.right = (a.querySelector('.btn').offsetWidth + 18) + 'px';
  });
  list.scrollTop = 0;
}

/* ---------- Categories sheet ---------- */
const CHECK_D = "M309.406 79.1683C309.981 79.508 310.171 80.2493 309.832 80.8242L303.279 91.9061C303.07 92.2599 302.695 92.4833 302.284 92.4991C301.874 92.5149 301.483 92.321 301.247 91.9843L297.719 86.9471C297.336 86.4001 297.469 85.6463 298.016 85.2634C298.563 84.8805 299.318 85.0136 299.701 85.5605L302.152 89.0601L307.749 79.5941C308.089 79.0193 308.83 78.8287 309.406 79.1683Z";
function renderCategories() {
  const cl = document.getElementById('catList');
  cl.innerHTML = '';
  const PA = platformApps();
  const cats = [...new Set(PA.map(a => a.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const items = [{ label: 'All Categories', value: null, app: PA[0] }]
    .concat(cats.map(c => ({ label: c, value: c, app: PA.find(a => a.category === c) })));   // icon = first app in that category, as in iOS 6
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'crow' + (state.cat === it.value ? ' sel' : '');
    b.innerHTML = `<div class="ci"></div><div class="cl">${esc(it.label)}</div>
      <svg class="chk" viewBox="297.5 79 12.5 13.5" aria-hidden="true"><path d="${CHECK_D}" fill="#384C84" fill-rule="evenodd" clip-rule="evenodd"/></svg>`;
    if (it.app) setIcon(b.querySelector('.ci'), it.app);
    b.onclick = () => { state.cat = it.value; closeSheet(); render(); };
    cl.appendChild(b);
  });
  cl.scrollTop = 0;
}
const sheet = document.getElementById('sheet');
function openSheet()  { renderCategories(); sheet.classList.add('open');    sheet.setAttribute('aria-hidden', 'false'); }
function closeSheet() { sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); }
document.getElementById('catBtn').onclick = openSheet;
document.getElementById('cancel').onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Top Paid / Top Free ---------- */
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });

/* ---------- status-bar clock ---------- */
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
tick(); setInterval(tick, 1000);

/* ---------- iOS / Android ---------- */
function pickTab() { state.tab = platformApps().some(a => !isFree(a)) ? 'paid' : 'free'; }
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => {
  if (state.platform === b.dataset.platform) return;
  state.platform = b.dataset.platform; state.cat = null; pickTab(); render();
});

/* ---------- scale the 320×568 canvas to fit the window ---------- */
function fit() {
  const vv = window.visualViewport;
  const w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
  const sc = Math.min(w / 320, h / 568);
  const el = document.getElementById('fit');
  el.style.width = (320 * sc) + 'px';
  el.style.height = (568 * sc) + 'px';
  document.getElementById('device').style.transform = 'scale(' + sc + ')';
}
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();

loadApps().then(apps => {
  APPS = apps.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' }));   // alphabetical by name
  pickTab();   // open on Top Paid when there are paid apps
  render();
});
</script>
